name: lif_dl
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # Core scientific computing
  - numpy=1.25.2
  - pandas=2.2.3
  - scipy=1.15.1
  
  # Machine learning
  - pytorch=2.2.4
  - torchvision=0.17.1
  - torchmetrics=1.3.1
  - pytorch-lightning=2.2.1
  - scikit-learn=1.5.2
  
  # Data handling
  - xarray=2024.3.0
  - netcdf4
  - h5netcdf=1.3.0
  - h5py=3.10.0
  - dask=2024.1.0
  
  # Spatial analysis (for Local Moran's I)
  - libpysal
  - esda
  
  # Visualization
  - matplotlib=3.10.0
  - seaborn=0.13.2
  
  # Jupyter
  - ipykernel=6.29.5
  - ipython=8.32.0
  - ipywidgets=8.1.5
  - jupyter_client=8.6.3
  - jupyter_core=5.7.2
  - jupyterlab_widgets=3.0.13
  
  # Utilities
  - pyyaml=6.0.1
  - tqdm=4.66.2
  - pillow=11.1.0
  
  # Experiment tracking
  - wandb
  
  # Development tools (optional)
  - pylint=3.0.3
  - memory_profiler=0.61.0
  - joblib=1.4.2
  - numba=0.61.0
